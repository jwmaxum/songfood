name: Song Food Worker CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    name: Test & Build Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Security and membership lint
        run: npm run lint:b2b
      - name: Product and pricing lint
        run: npm run lint:pricing
      - name: B2B customer experience lint
        run: npm run lint:storefront
      - name: B2B inquiry and quote workflow lint
        run: npm run lint:crm
      - name: Proforma Invoice lint
        run: npm run lint:pi
      - name: Unit and authorization tests
        run: npm test -- --runInBand
      - name: Type check
        run: npm run typecheck
      - name: Build Cloudflare Worker (no live credentials)
        run: npm run build:worker
