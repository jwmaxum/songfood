name: Song Food Worker CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: Test & Build Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Whole repository lint
        run: npm run lint
      - name: Unit, authorization and regression tests
        run: npm test -- --runInBand --coverage
      - name: Type check
        run: npm run typecheck
      - name: Build Cloudflare Worker (public config without server secrets)
        env:
          NEXT_PUBLIC_APP_URL: https://song-food.jwmaxum.workers.dev
          NEXT_PUBLIC_SUPABASE_URL: https://supabase-build.example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_build_fixture_only_no_access
        run: npm run build:worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 14
  browser:
    name: Isolated browser and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Production-mode browser tests (local fixtures only)
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            playwright-report/
            test-results/
          retention-days: 14
